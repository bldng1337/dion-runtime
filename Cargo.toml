[workspace]

members = [
    "rust/core",
    "rust/dion_extension",
    "dart/rdion_runtime/rust",
    "js/runtime",
    "rust/specta_valibot",
    "rust/mihon",
    "rust/lnreader",
]
resolver = "3"

[profile.bench]
opt-level = 3

[profile.dev]
opt-level = 1
debug="line-tables-only"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "unwind"
debug="none"

# Local override: unrar_sys 0.5.8 gates Windows-only sources and libs on the
# build HOST instead of the TARGET, so building for Android from a Windows
# host compiles isnt.cpp for Android (fails) and links shell32/powrprof.
[patch.crates-io]
unrar_sys = { path = "rust/patches/unrar_sys" }
