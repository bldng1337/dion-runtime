group 'com.flutter_rust_bridge.rdion_runtime'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        // 2.2.x is required to consume kotlinx-serialization 1.11 / stdlib
        // 2.3.x (used by newer keiyoushi extensions' host classpath): their
        // Kotlin metadata is 2.3.0, which the 2.1.0 compiler cannot read.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.2.20'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.rdion_runtime'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdkVersion 26

        // Keep/dontwarn rules for the Mihon extension adapter: extensions
        // are loaded at runtime against the host APK, and the okhttp3 keep
        // rules surface optional TLS provider references that R8 full mode
        // rejects. Merged into every consuming app's shrinker config.
        consumerProguardFiles 'consumer-rules.pro'
    }

    // Include compat-android Kotlin + Java sources (AndroidMihonBridge,
    // source-api stubs, and the Rhino-backed QuickJs bridge).
    sourceSets {
        main {
            java.srcDirs += '../../../rust/mihon/compat-android/src/main/kotlin'
            java.srcDirs += '../../../rust/mihon/compat-android/src/main/java'
        }
    }
}

dependencies {
    // Kotlin. stdlib pinned to 2.1.20 (newer than the 2.1.0 Gradle plugin, which
    // is allowed) to provide kotlin.time.Instant, added to the stdlib in 2.1.20
    // and used by some extensions (e.g. komiic).
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"
    // 1.10+ is required by newer keiyoushi extensions: they are compiled
    // against `BuildersKt.runBlockingK` (the bytecode name `runBlocking` got
    // in 1.10.0) and fail with NoSuchMethodError on older coroutines.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    // kotlinx-serialization: match Mihon upstream. Extensions compiled with
    // the serialization plugin 1.8+ generate serializers that no longer
    // implement `GeneratedSerializer.typeParametersSerializers()`; a host
    // runtime older than that calls it and fails with AbstractMethodError
    // (surfaced by the Android repo-suite harness on browse/search).
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    // JSON parsing directly from Okio sources (kotlinx.serialization.json.okio.
    // OkioStreamsKt) — used by many extensions in mangaDetailsParse etc. Without
    // this the class is absent and those sources throw NoClassDefFoundError.
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.11.0"
    // Protobuf serialization (used by a few extensions for binary API payloads)
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.11.0"

    // HTTP client (OkHttp - required by Mihon extensions).
    // 5.x stable line: current keiyoushi extensions reference OkHttp 5
    // compression classes (okhttp3.CompressionInterceptor, Gzip,
    // brotli.Brotli, zstd.Zstd) from the host classloader; 5.0.0-alpha.14 has
    // no okhttp3.CompressionInterceptor and fails those extensions with
    // NoClassDefFoundError.
    //
    // The plain JVM jars are used instead of the `okhttp` module's
    // `okhttp-android` AAR variant, whose AAR metadata demands compileSdk 37
    // (this plugin compiles against 36). The JVM artifacts run fine on ART —
    // that is what OkHttp shipped for Android before the dedicated variant
    // existed, and the desktop compat layer runs extensions against the same
    // jars.
    implementation "com.squareup.okhttp3:okhttp-jvm:5.5.0"
    // brotli/zstd's Gradle module metadata still depend on the `okhttp`
    // module (whose Android variant is rejected above); exclude it so only
    // okhttp-jvm is resolved.
    implementation("com.squareup.okhttp3:okhttp-brotli:5.5.0") {
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    }
    implementation("com.squareup.okhttp3:okhttp-zstd:5.5.0") {
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    }

    // HTML parsing (JSoup - required by most extensions). Pinned to 1.22.2 to
    // match the desktop compat layer and include newer APIs some extensions use
    // (e.g. Elements.selectFirst, absent in 1.17.x).
    implementation "org.jsoup:jsoup:1.22.2"

    // RxJava (some extensions use it)
    implementation "io.reactivex:rxjava:1.3.8"

    // Rhino: pure-Java JavaScript engine backing the app.cash.quickjs.QuickJs
    // bridge (some extensions evaluate JS to decrypt URLs / bypass protection).
    // Works on Android (ART) since Rhino is pure Java.
    implementation "org.mozilla:rhino:1.7.15"

    // Injekt - dependency injection used by Mihon extensions
    implementation "com.github.mihonapp:injekt:91edab2317"

    // androidx.preference - ConfigurableSource extensions build their
    // preference screens against it, so the host must provide the real
    // classes at runtime. getPreferenceList/applyPreferences read and write
    // them headlessly via PreferenceManager.
    implementation "androidx.preference:preference:1.2.1"

    // Logging
    implementation "org.slf4j:slf4j-api:2.0.12"
    implementation "io.github.oshai:kotlin-logging-jvm:6.0.3"
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../rust"
    libname = "rdion_runtime"
}
